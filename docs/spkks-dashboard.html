<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard SPKKS SD — Al Qomar</title>
<style>
:root{
  --h:#1a5c38;--h2:#1e6e42;--h3:#2a8a54;--e:#c8922a;--e2:#e0a832;--ep:#fdf3e0;--kr:#faf7f2;--kr2:#f0e9d8;
  --tx:#1f2a24;--mu:#66736b;--bd:#e3dccb;--ok:#1f8a4c;--wa:#c8922a;--er:#b3392f;--wh:#fff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 "Segoe UI",Calibri,Arial,sans-serif;color:var(--tx);background:var(--kr)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;color:var(--h)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* header */
.top{background:linear-gradient(135deg,var(--h),var(--h2) 60%,var(--h3));color:#fff;padding:14px 20px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--e),var(--e2),var(--e))}
.top-in{max-width:1240px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{flex:1 1 280px;min-width:0}
.brand h1{color:#fff;font-size:19px;line-height:1.2}
.brand small{opacity:.85;display:block;margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.st{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:6px 12px;min-width:92px}
.st b{display:block;font-size:18px;line-height:1.1}
.st span{font-size:11px;opacity:.85}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:#fff;color:var(--h);border-radius:8px;padding:7px 13px;font-weight:600}
.btn:hover{background:var(--ep)}
.btn.gold{background:var(--e);border-color:var(--e);color:#fff}
.btn.gold:hover{background:var(--e2)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:600}
.btn.dg{color:var(--er)}
.top .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.25)}
.top .btn.gold{background:var(--e);border-color:var(--e)}
.tabs{max-width:1240px;margin:0 auto;display:flex;gap:4px;padding:14px 20px 0;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:10px 10px 0 0;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{background:rgba(255,255,255,.15)}
.tab.on{color:var(--h);background:#fff;border-bottom-color:var(--e)}
main{max-width:1240px;margin:0 auto;padding:0 20px 60px}
.pane{display:none;background:#fff;border:1px solid var(--bd);border-radius:0 12px 12px 12px;padding:20px;box-shadow:0 2px 10px rgba(26,92,56,.06)}
.pane.on{display:block}
.save{font-size:11px;opacity:.85;align-self:center}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{border:1px solid var(--bd);border-left:5px solid var(--e);border-radius:10px;padding:12px 14px;background:var(--kr)}
.card small{color:var(--mu);display:block}
.card b{font-size:26px;font-family:Georgia,serif;color:var(--h);line-height:1.15}
.card em{font-style:normal;font-size:12px;color:var(--mu)}
.pred{font-size:44px!important}
h2{font-size:18px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--kr2);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;background:var(--e);transform:rotate(45deg);flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 16px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mu)}
label.f input,label.f textarea{display:block;width:100%;margin-top:3px;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:#fff;color:var(--tx);font-weight:400;font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--e2);outline-offset:0}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bd);padding:7px 9px;vertical-align:top;text-align:left}
th{background:var(--h);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
tbody tr:nth-child(even) td{background:#fcfaf5}
.num{text-align:center;white-space:nowrap}
.bar{height:8px;background:var(--kr2);border-radius:5px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--h3),var(--e))}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--kr2);color:var(--mu);white-space:nowrap}
.b4{background:#d6efdf;color:#0f6a37}.b3{background:#e3f1d3;color:#3d6e12}.b2{background:#fbeccb;color:#8a5a00}.b1{background:#f8d9d5;color:#a02a20}
.bok{background:#d6efdf;color:#0f6a37}.bno{background:#f3e7e5;color:#a02a20}.bpa{background:#fbeccb;color:#8a5a00}
.chip{display:inline-block;margin:1px 2px 1px 0;padding:1px 8px;border:1px solid var(--h3);border-radius:99px;color:var(--h);background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.chip:hover{background:var(--h);color:#fff}
.chip.bf{border-color:var(--e);color:#8a5a00}
.chip.bf:hover{background:var(--e);color:#fff}
.ki{font-size:10px;color:var(--e);font-weight:700;letter-spacing:.4px}
.doc{margin-top:4px;font-size:12px;color:var(--mu)}
.doc b{color:var(--h)}
/* toolbar */
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool input[type=search],.tool select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--h);color:#fff}
.dhead td{background:var(--h2)!important;color:#fff;font-weight:700;font-family:Georgia,serif;font-size:14px}
.dhead small{font-weight:400;opacity:.9;font-family:"Segoe UI",sans-serif;margin-left:8px}
/* skor */
.sk{display:inline-flex;gap:4px}
.sk button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;font-weight:700;color:var(--mu)}
.sk button:hover{border-color:var(--h3)}
.sk button.on{color:#fff;border-color:transparent}
.sk button.on[data-v="4"]{background:#1f8a4c}.sk button.on[data-v="3"]{background:#6aa52b}.sk button.on[data-v="2"]{background:#d99a14}.sk button.on[data-v="1"]{background:#c0463b}
td textarea,td input[type=text],td input[type=url]{width:100%;padding:5px 7px;border:1px solid var(--bd);border-radius:6px;background:#fff;resize:vertical}
td textarea{min-height:44px}
tr.flash td{animation:fl 1.8s}
@keyframes fl{0%,40%{background:#fff0bd}100%{background:inherit}}
.sw{position:relative;display:inline-block;width:42px;height:24px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cfc8b6;border-radius:24px;transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::before{transform:translateX(18px)}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.hint{color:var(--mu);font-size:12px}
.warn{background:var(--ep);border:1px solid #ecd9a8;border-radius:10px;padding:12px 16px}
.warn ul{margin:6px 0 0;padding-left:20px}
.warn li{margin:2px 0}
.warn a{color:var(--h);font-weight:700;cursor:pointer;text-decoration:underline}
.ok{color:var(--ok);font-weight:700}
.todo{background:#fff5d6;border-left:3px solid var(--e);padding:3px 8px;border-radius:4px;font-size:12px;margin-top:4px}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pp .card{border-left-width:5px}
.pp p{margin:6px 0 10px;color:var(--mu)}
/* print area */
#print{display:none}
@media (max-width:820px){
  .top-in{gap:10px}.brand h1{font-size:16px}.pane{padding:12px;border-radius:0 0 12px 12px}main,.tabs{padding-left:10px;padding-right:10px}
  table.rs,table.rs tbody,table.rs tr,table.rs td{display:block;width:100%}
  table.rs thead{display:none}
  table.rs tr{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:6px;background:#fff}
  table.rs td{border:0;padding:4px 6px}
  table.rs tr.dhead{background:var(--h2);border-radius:8px}
  table.rs tr:nth-child(even) td{background:transparent}
}
@page{size:A4;margin:14mm 14mm 16mm}
@page land{size:A4 landscape;margin:12mm}
@media print{
  html,body{background:#fff!important}
  .top,.tabs,main{display:none!important}
  #print{display:block!important;font:11pt/1.45 "Times New Roman",Georgia,serif;color:#000}
  #print h1,#print h2,#print h3{color:#000;font-family:"Times New Roman",serif;border:0}
  #print h2::before{display:none}
  #print table{font-size:9.5pt}
  #print th{background:#1a5c38!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:8.5pt}
  #print td,#print th{border:1px solid #777;padding:3px 5px}
  #print tbody tr:nth-child(even) td{background:#fff}
  #print tr{break-inside:avoid}
  #print .pg{break-after:page}
  #print .land{page:land}
  #print .dhead td{background:#d9e8de!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .kop{text-align:center;border-bottom:3px double #1a5c38;padding-bottom:8px;margin-bottom:14px}
  .kop b{display:block;font-size:13pt;color:#1a5c38}
  .kop span{font-size:9pt}
  .cover{text-align:center;padding-top:50mm}
  .cover h1{font-size:20pt;margin:14mm 0 4mm}
  .cover p{margin:3px 0}
  .sign{display:flex;justify-content:space-around;margin-top:18mm;text-align:center;break-inside:avoid}
  .sign div{min-width:60mm}
  .sign u{font-weight:bold}
  .pb{border:1px solid #000;padding:2px 8px}
}
@media screen{
  .kop,.cover,.sign{display:none}
}

/* editor dokumen */
.blk{border:1px solid var(--bd);border-left:5px solid var(--h3);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fff}
.blk.bab{border-left-color:var(--e);background:var(--ep)}
.blk.sub{border-left-color:var(--e2)}
.blk .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.blk .ops{display:flex;gap:4px}
.blk input,.blk textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:#fff;margin-bottom:4px}
.ge{width:auto;min-width:100%}.ge td{padding:2px;border:1px solid var(--bd)!important;background:#fff!important}.ge input{border:0;padding:5px 6px;margin:0;min-width:90px}
.ge tr:first-child input{font-weight:700;background:#eef5f0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.th{width:170px;border:1px solid var(--bd);border-radius:8px;padding:6px;background:var(--kr)}
.th img{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:4px;background:#ddd}
.addbar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--kr2);padding:10px 0;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.mini{width:100%;padding:4px 7px;border:1px solid var(--bd);border-radius:6px;margin-bottom:4px;font-size:12px}
code{background:var(--kr2);padding:1px 5px;border-radius:4px}
@media print{
  @page{@bottom-right{content:counter(page);font:9pt serif}}
  #print .doc{font-family:"Arial Narrow","Liberation Sans Narrow",Arial,Helvetica,sans-serif;font-size:11.5pt;line-height:1.6;text-align:justify}
  #print .doc p{margin:0 0 6pt;text-indent:10mm}
  #print .doc h2.db{text-align:center;font-size:12.5pt;margin:14pt 0 10pt;break-after:avoid;font-family:inherit}
  #print .doc h3{font-size:11.5pt;margin:12pt 0 4pt;break-after:avoid;font-family:inherit}
  #print .doc .pbk{break-before:page}
  #print .doc ol{margin:0 0 6pt;padding-left:9mm}
  #print .doc table{font-size:10pt;margin:2pt 0 10pt;width:100%;text-align:left}
  #print .doc th{background:#e6e6e6!important;color:#000!important;font-size:10pt;text-transform:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .doc .cap{text-indent:0;text-align:center;margin:8pt 0 3pt;break-after:avoid}
  #print .doc .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin:4pt 0}
  #print .doc figure{margin:0;break-inside:avoid;text-align:center}
  #print .doc figure img{max-width:100%;max-height:78mm;object-fit:contain}
  #print .doc figcaption{font-size:9.5pt;text-indent:0}
  #print .doc mark{background:#ffe97a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .dwrap+.dwrap{break-before:page}
  #print .dcover{text-align:center}.dcover h1{font-size:15pt;margin:12mm 0 3mm;font-family:inherit}.dcover h1.tt{font-size:17pt;margin:14mm 0 0}.dcover p.c{text-align:center;text-indent:0}
  .dkop{display:flex;align-items:center;gap:6mm;border-bottom:3px double #1a5c38;padding-bottom:5mm;text-align:left}
  .dkop img{width:24mm;height:24mm;object-fit:contain}.dkop b{display:block;color:#1a5c38;font-size:13pt}.dkop b.s2{font-size:15pt}.dkop span{font-size:9pt}
  #print .doc .toc div{margin:2pt 0;text-align:left}
  #print .doc .sign{display:flex;justify-content:space-around;margin-top:14mm;text-align:center;break-inside:avoid}
  #print .doc .sign1{display:flex;justify-content:flex-end;margin-top:10mm;text-align:center;break-inside:avoid}
  #print .doc .sign1>div{min-width:70mm}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Dashboard SPKKS — Jenjang SD</h1>
      <small>Supervisi &amp; Penilaian Kinerja Kepala Sekolah · <span id="hd-sch"></span></small>
    </div>
    <div class="stats">
      <div class="st"><b id="hs-nilai">0/99</b><span>Indikator dinilai</span></div>
      <div class="st"><b id="hs-bf">0/87</b><span>Bukti fisik siap</span></div>
      <div class="st"><b id="hs-pct">–</b><span>Skor total</span></div>
    </div>
    <div class="acts">
      <button class="btn gold" data-act="print" data-m="full">Cetak / Simpan PDF</button>
    </div>
    <div class="save" id="saveMsg"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="ringkasan">Ringkasan</button>
    <button class="tab" data-tab="instrumen">Instrumen (99)</button>
    <button class="tab" data-tab="bukti">Bukti Fisik (87)</button>
    <button class="tab" data-tab="cetak">Cetak &amp; Cadangan</button>
  </nav>
</header>

<main id="app">
  <section class="pane on" id="p-ringkasan"></section>
  <section class="pane" id="p-instrumen"></section>
  <section class="pane" id="p-bukti"></section>
  <section class="pane" id="p-cetak"></section>
  <section class="pane" id="p-doc"></section>
</main>

<div id="print"></div>
<input type="file" id="impFile" accept="application/json" hidden>
<input type="file" id="attFile" hidden>
<input type="file" id="imgFile" accept="image/*" multiple hidden>

<script>

let dbp;
function db(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    try{
      const r = indexedDB.open('spkks-files',1);
      r.onupgradeneeded = ()=>r.result.createObjectStore('f');
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbp;
}
async function idb(mode, fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction('f',mode); const r = fn(t.objectStore('f'));
    t.oncomplete = ()=>res(r&&r.result); t.onerror = ()=>rej(t.error);
  });
}
const putFile = (k,file)=>idb('readwrite',s=>s.put(file,k));

/* ---------- perhitungan ---------- */
function indStatus(n){
  const keys = bfByInd[n]||[]; const done = keys.filter(k=>B(k).st==='sudah').length;
  return {done,total:keys.length,ok:keys.length>0&&done===keys.length};
}
function dimStats(k){
  const d = DIMS[k]; let n=0,sum=0,up=0;
  d.ind.forEach(i=>{ const v=S.skor[i.no]; if(v){n++;sum+=v;} if(indStatus(i.no).ok) up++; });
  const avg = n?sum/n:0;
  return {n,sum,avg,pct:n?sum/(4*n):0,up,tot:d.ind.length,kat:n?katAvg(avg):'–'};
}
function totals(){
  let n=0,sum=0,up=0;
  DIMS.forEach((d,k)=>{const s=dimStats(k); n+=s.n; sum+=s.sum; up+=s.up;});
  const p = n?sum/(4*n):0;
  const bfDone = BF.filter(b=>B(bfKey(b)).st==='sudah').length;
  return {n,sum,up,pct:p,avg:n?sum/n:0,bfDone,final:n===TOTAL_IND,pred:n?predikat(p):['–','Belum dinilai']};
}
function stats(){
  const t = totals();

  $('#hs-bf').textContent = t.bfDone+'/'+BF.length;

  if(f.startsWith('cat.') && !v) delete S.cat[f.slice(4)]; else setPath(f, v);
  save();
  if(f==='id.sekolah') stats();
});
document.addEventListener('change', e=>{
  const t=e.target, a=t.dataset?.act, k=t.dataset?.k;
  if(a==='bfTog'){
    B(k).st = t.checked?'sudah':'belum'; save();
    const row=$('#bf-'+k); $('[data-c=lab]',row).textContent=t.checked?'Sudah':'Belum'; stats();
  }
  else if(a==='bfTodo'){ B(k).todo=t.checked; save(); }
  else if(t.dataset?.bf){
    const x=B(t.dataset.bf);
    if((x.file||x.link) && x.st!=='sudah'){ x.st='sudah'; save(); const row=$('#bf-'+t.dataset.bf); $('[data-act=bfTog]',row).checked=true; $('[data-c=lab]',row).textContent='Sudah'; stats(); }
    if(t.type==='url'){ drawBfRowTools(t.dataset.bf); }
  }
});
function drawBfRowTools(k){ const row=$('#bf-'+k); if(!row) return; const pos=row.querySelector('.fl'); const x=B(k);
  pos.innerHTML = `<button class="btn sm" data-act="attach" data-k="${k}">Lampirkan berkas</button>${x.blob?`<button class="btn sm" data-act="openF" data-k="${k}">Buka</button><button class="btn sm dg" data-act="delF" data-k="${k}">Hapus berkas</button>`:''}${x.link?`<a class="btn sm" href="${esc(x.link)}" target="_blank" rel="noopener">Buka tautan</a>`:''}`; }
$('#attFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f||!attachKey) return;
  const k=attachKey;
  try{ await putFile(k,f); const x=B(k); x.blob=true; if(!x.file) x.file=f.name; x.st='sudah'; save(); drawBf(); stats(); }
  catch(err){ alert('Peramban menolak menyimpan berkas (mode privat / kuota penuh). Isi nama berkas atau tautan saja.'); }
});
$('#impFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{
    const o=JSON.parse(r.result); if(!o.skor||!o.bf||!o.id) throw 0;
    if(!confirm('Impor akan MENIMPA data saat ini. Lanjutkan?')) return;
    S={id:{...DEF().id,...o.id},skor:o.skor,cat:o.cat||{},dimNote:o.dimNote||{},doc:o.doc||{},bf:o.bf};
    $$('.pane').forEach(p=>p.dataset.init=''); save(); showTab('ringkasan');
  }catch(err){ alert('Berkas cadangan tidak valid.'); } }; r.readAsText(f);
});
window.addEventListener('beforeprint',()=>{ if(!$('#print').innerHTML) $('#print').innerHTML=coverPage()+ringPage()+instPage()+bfPage(); });
window.addEventListener('afterprint',()=>{ $('#print').innerHTML=''; });

function docText(d){ const a=[d.title,d.kpText]; d.blocks.forEach(b=>{a.push(b.text,b.cap); (b.rows||[]).forEach(r=>a.push(...r)); (b.imgs||[]).forEach(i=>a.push(i.label));}); return a.filter(Boolean).join('\n'); }
const phCount = d => (docText(d).match(PH)||[]).length;
const hasDoc = k => !!(S.doc[k] && S.doc[k].blocks);

  const tujuan=`Menyajikan bukti nyata pelaksanaan ${b.t.toLowerCase()} di ${sch}.\nMemenuhi tuntutan Butir ${nums} pada instrumen SPKKS.\n[isi: tujuan lain bila ada]`;

  else if(/hadir|piket|absensi|fingerprint|agenda kerja|jurnal harian/.test(t)) mid=[{t:'bab',text:'KETENTUAN DAN PENCATATAN'},{t:'sub',text:'Ketentuan'},{t:'p',text:'[isi: ketentuan jam kerja / tata cara pencatatan yang berlaku.]'},{t:'bab',text:'REKAP PER BULAN'},{t:'sub',text:'Rekap Bulanan'},tbl('Rekap per bulan',[['Bulan','Hari efektif','Hadir','Persentase','Dinas luar','Izin'],['','','','','',''],['','','','','',''],['Jumlah','','','','','']]),{t:'sub',text:'Catatan Harian'},tbl('Cuplikan pencatatan harian',[['No','Hari dan tanggal','Jam masuk','Jam pulang','Keterangan'],...blank(5,5)])];
  else if(/observasi|wawancara/.test(t)) mid=[{t:'bab',text:'METODE DAN HASIL'},{t:'sub',text:'Metode'},{t:'p',text:'[isi: tanggal, pelaksana, responden/objek, dan cara pengambilan data.]'},{t:'sub',text:'Hasil'},tbl('Rekap hasil',[['No','Aspek yang diamati / pertanyaan','Hasil / jawaban','Keterangan'],...blank(6,4)]),{t:'sub',text:'Kesimpulan'},{t:'p',text:'[isi: kesimpulan dan temuan utama.]'}];
  else if(/notulen|rapat|undangan|sosialisasi|daftar hadir|kegiatan|dokumentasi|mpls|apresiasi|diklat|pelatihan|gathering|kkg|kombel|refleksi/.test(t)) mid=[{t:'bab',text:'PELAKSANAAN KEGIATAN'},{t:'sub',text:'Rekap Kegiatan'},tbl('Rekap kegiatan',[['No','Hari dan tanggal','Kegiatan / agenda','Peserta','Hasil / tindak lanjut'],...blank(4,5)]),{t:'sub',text:'Ringkasan Notulen / Hasil'},{t:'p',text:'[isi: ringkasan pembahasan dan keputusan kegiatan.]'}];
  else if(/laporan|analisis|data|evaluasi|rekap|leger|telaah|rapor|tka|eds|osn|alumni/.test(t)) mid=[{t:'bab',text:'DATA DAN HASIL'},{t:'sub',text:'Data'},tbl('Data pendukung',[['No','Uraian','Nilai / jumlah','Keterangan'],...blank(5,4)]),{t:'sub',text:'Analisis'},{t:'p',text:'[isi: analisis data — tren, capaian, dan akar masalah.]'}];
  else mid=[{t:'bab',text:'URAIAN DOKUMEN'},{t:'sub',text:'Isi Kebijakan / Program'},{t:'p',text:'[isi: uraian isi dokumen — nomor SK/kebijakan, ketentuan pokok, penanggung jawab.]'},{t:'sub',text:'Rincian'},tbl('Rincian pelaksanaan',[['No','Komponen','Uraian','Penanggung jawab','Waktu'],...blank(4,5)])];
  return [
    {t:'bab',text:'PENDAHULUAN'},{t:'sub',text:'Latar Belakang'},{t:'p',text:intro},

    ...mid,

    {t:'bab',text:'PENUTUP'},{t:'p',text:`Dokumen ini menjawab Butir ${nums} dengan menyajikan uraian, data, dan dokumentasi pelaksanaan. Pencatatan dan pelaksanaan akan terus dijaga agar dapat diperiksa kapan saja.`},{t:'ttd'},
    {t:'lamp',text:'Dokumentasi Kegiatan'},{t:'foto',cap:'[isi: keterangan foto, tempat, dan tanggal]',imgs:[]}
  ];

function newDoc(k){
  const b=BFMAP[k];
  return {title:b.t.toUpperCase(),penyusun:S.id.ks,tanggal:S.id.tanggal,cover:true,pengesahan:true,kp:true,toc:true,
    kpText:`Puji syukur kami panjatkan ke hadirat Allah SWT atas rahmat dan karunia-Nya sehingga dokumen ${b.t.toLowerCase()} ${S.id.sekolah} Tahun Pelajaran ${S.id.tahun} ini dapat tersusun. Dokumen ini merupakan bukti fisik Supervisi dan Penilaian Kinerja Kepala Sekolah (SPKKS) untuk Butir ${b.ind.join(', ')}.\nKami mengucapkan terima kasih kepada Yayasan Pendidikan Islam Purnama Cendekia, dewan guru, dan tenaga kependidikan yang membantu penyusunan dokumen ini.`,
    blocks:starter(b)};
}
function docOpen(k){ if(!hasDoc(k)){ S.doc[k]=newDoc(k); save(); } DK=k; showTab('doc'); window.scrollTo(0,0); }

/* ---------- editor ---------- */
function gridHTML(P,bl,i){
  return `<div style="overflow-x:auto"><table class="ge"><tbody>${bl.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td><input data-f="${P}.rows.${ri}.${ci}" value="${esc(c)}"></td>`).join('')}<td style="border:0"><button class="btn sm dg" data-da="delrow" data-i="${i}" data-r="${ri}" title="Hapus baris">×</button></td></tr>`).join('')}
  <tr>${bl.rows[0].map((_,ci)=>`<td style="border:0;text-align:center"><button class="btn sm dg" data-da="delcol" data-i="${i}" data-c="${ci}" title="Hapus kolom">×</button></td>`).join('')}<td style="border:0"></td></tr></tbody></table></div>
  <div class="fl"><button class="btn sm" data-da="addrow" data-i="${i}">+ Baris</button><button class="btn sm" data-da="addcol" data-i="${i}">+ Kolom</button><span class="hint">Baris pertama = judul kolom.</span></div>`;
}
function blkHTML(bl,i){
  const P=`doc.${DK}.blocks.${i}`;
  const ops=`<span class="ops"><button class="btn sm" data-da="up" data-i="${i}" title="Naikkan">▲</button><button class="btn sm" data-da="dn" data-i="${i}" title="Turunkan">▼</button><button class="btn sm dg" data-da="del" data-i="${i}">Hapus</button></span>`;
  const hd=l=>`<div class="bh"><b>${l}</b>${ops}</div>`;
  const inp=(f,ph)=>`<input data-f="${P}.${f}" value="${esc(bl[f])}" placeholder="${ph||''}">`;
  switch(bl.t){
    case 'bab': return `<div class="blk bab">${hd('BAB (judul)')}${inp('text','Judul bab, mis. PENDAHULUAN')}</div>`;
    case 'sub': return `<div class="blk sub">${hd('Subbab')}${inp('text','Judul subbab')}</div>`;
    case 'p': return `<div class="blk">${hd('Paragraf')}<textarea rows="5" data-f="${P}.text">${esc(bl.text)}</textarea></div>`;
    case 'list': return `<div class="blk">${hd('Daftar bernomor')}<textarea rows="4" data-f="${P}.text">${esc(bl.text)}</textarea><span class="hint">Satu butir per baris.</span></div>`;
    case 'ttd': return `<div class="blk">${hd('Tanda tangan Kepala Sekolah')}<span class="hint">Memuat kota, tanggal, jabatan, dan nama dari data identitas.</span></div>`;
    case 'lamp': return `<div class="blk bab">${hd('LAMPIRAN (halaman baru)')}${inp('text','Judul lampiran')}</div>`;
    case 'tbl': return `<div class="blk">${hd('Tabel')}${inp('cap','Judul tabel')}${gridHTML(P,bl,i)}</div>`;
    case 'foto': return `<div class="blk">${hd('Foto / gambar')}${inp('cap','Keterangan gambar (mis. Kepala Sekolah menyambut murid, 8 Oktober 2026)')}
      <div class="thumbs">${bl.imgs.map((im,j)=>`<div class="th"><img data-iid="${im.id}" alt=""><input data-f="${P}.imgs.${j}.label" value="${esc(im.label)}" placeholder="Label foto"><button class="btn sm dg" data-da="delimg" data-i="${i}" data-j="${j}">Hapus</button></div>`).join('')}</div>
      <div class="fl"><button class="btn sm" data-da="addimg" data-i="${i}">+ Tambah foto</button><span class="hint">Foto diperkecil otomatis dan disimpan di peramban ini.</span></div></div>`;
  }
  return '';
}
async function rDoc(){
  const k=DK, p=$('#p-doc');
  if(!k||!hasDoc(k)){ showTab('bukti'); return; }
  const b=BFMAP[k], d=S.doc[k], ph=phCount(d);
  await ensureImgs(docIds(d));
  const tg=(n,l)=>`<label class="hint" style="margin-right:12px"><input type="checkbox" data-da="tog" data-n="${n}" ${d[n]?'checked':''}> ${l}</label>`;
  p.innerHTML=`
  <div class="tool"><button class="btn" data-da="back">← Kembali ke Bukti Fisik</button>
    <button class="btn gold" data-da="print">Cetak / Simpan PDF dokumen ini</button>
    <button class="btn" data-da="done">Tandai bukti siap</button></div>
  <h2 style="margin-top:6px">Dokumen ${kodeOf(b)} · ${DIMS[b.d].kode}.${b.no} ${esc(b.t)}</h2>
  <div class="warn"><b>Indikator yang dijawab dokumen ini:</b><ul>${b.ind.map(n=>`<li><b>Butir ${n}</b> — ${esc(IND[n].t)}</li>`).join('')}</ul>
  ${ph?`<div class="todo">Masih ada <b>${ph}</b> isian bertanda <code>[isi: …]</code> yang perlu diganti dengan data nyata sebelum dicetak final.</div>`:'<div class="ok" style="margin-top:6px">Tidak ada isian [isi: …] tersisa.</div>'}</div>
  <h2>Sampul &amp; kelengkapan</h2>
  <div class="grid2">
    <label class="f" style="grid-column:1/-1">Judul dokumen<input data-f="doc.${k}.title" value="${esc(d.title)}"></label>
    <label class="f">Disusun oleh<input data-f="doc.${k}.penyusun" value="${esc(d.penyusun)}"></label>
    <label class="f">Tanggal dokumen<input type="date" data-f="doc.${k}.tanggal" value="${esc(d.tanggal)}"></label>
  </div>
  <p>${tg('cover','Sampul')}${tg('pengesahan','Lembar pengesahan')}${tg('kp','Kata pengantar')}${tg('toc','Daftar isi, tabel &amp; gambar')}</p>
  <label class="f">Kata pengantar<textarea rows="5" data-f="doc.${k}.kpText" style="display:block;width:100%;margin-top:3px;padding:7px 9px;border:1px solid var(--bd);border-radius:7px">${esc(d.kpText)}</textarea></label>
  <h2>Isi dokumen</h2>
  <div id="blks">${d.blocks.map(blkHTML).join('')}</div>
  <div class="addbar"><b class="hint" style="align-self:center">Tambah:</b>
    ${[['bab','+ Bab'],['sub','+ Subbab'],['p','+ Paragraf'],['list','+ Daftar'],['tbl','+ Tabel'],['foto','+ Foto'],['ttd','+ Tanda tangan'],['lamp','+ Lampiran']].map(([t,l])=>`<button class="btn sm" data-da="add" data-t="${t}">${l}</button>`).join('')}
    <span style="flex:1"></span><button class="btn sm dg" data-da="retpl">Terapkan ulang template</button><button class="btn sm dg" data-da="deldoc">Hapus dokumen</button></div>`;
  $$('img[data-iid]',p).forEach(im=>{ im.src=IMG[im.dataset.iid]||''; });
}
function readImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff';x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.82)); };
  im.onerror=()=>rej(new Error('format')); im.src=u; }); }
const blank2=(r,c)=>Array.from({length:r},()=>Array(c).fill(''));
$('#p-doc').addEventListener('click', async e=>{
  const t=e.target.closest('[data-da]'); if(!t) return;
  const a=t.dataset.da, d=S.doc[DK], i=+t.dataset.i;
  if(t.tagName==='INPUT'&&t.type==='checkbox'){ return; }
  if(a==='back') return showTab('bukti');
  if(a==='print') return printDocs([DK]);
  if(a==='done'){ const x=B(DK),b=BFMAP[DK]; x.st='sudah'; if(!x.file) x.file=baseOf(b)+' - '+b.t+'.pdf'; save(); stats(); alert('Bukti '+DIMS[b.d].kode+'.'+b.no+' ditandai siap. Jangan lupa cetak PDF-nya.'); return; }
  if(a==='add'){ const ty=t.dataset.t; const nb={bab:{t:'bab',text:''},sub:{t:'sub',text:''},p:{t:'p',text:''},list:{t:'list',text:''},tbl:{t:'tbl',cap:'',rows:blank2(3,4)},foto:{t:'foto',cap:'',imgs:[]},ttd:{t:'ttd'},lamp:{t:'lamp',text:''}}[ty]; d.blocks.push(nb); save(); await rDoc(); const l=$$('#blks .blk'); l[l.length-1]?.scrollIntoView({block:'center'}); return; }
  if(a==='up'&&i>0){ [d.blocks[i-1],d.blocks[i]]=[d.blocks[i],d.blocks[i-1]]; }
  else if(a==='dn'&&i<d.blocks.length-1){ [d.blocks[i+1],d.blocks[i]]=[d.blocks[i],d.blocks[i+1]]; }
  else if(a==='del'){ if(!confirm('Hapus blok ini?')) return; d.blocks.splice(i,1); }
  else if(a==='addrow'){ const r=d.blocks[i].rows; r.push(Array(r[0].length).fill('')); }
  else if(a==='addcol'){ d.blocks[i].rows.forEach(r=>r.push('')); }
  else if(a==='delrow'){ const r=d.blocks[i].rows; if(r.length>1) r.splice(+t.dataset.r,1); }
  else if(a==='delcol'){ const r=d.blocks[i].rows; if(r[0].length>1) r.forEach(x=>x.splice(+t.dataset.c,1)); }
  else if(a==='addimg'){ IMGBLK=i; const f=$('#imgFile'); f.value=''; f.click(); return; }
  else if(a==='delimg'){ const im=d.blocks[i].imgs.splice(+t.dataset.j,1)[0]; try{ await delFile('img:'+im.id); }catch(x){} delete IMG[im.id]; }
  else if(a==='retpl'){ if(!confirm('Template akan MENIMPA seluruh isi dokumen ini. Lanjutkan?')) return; S.doc[DK]=newDoc(DK); }
  else if(a==='deldoc'){ if(!confirm('Hapus dokumen ini beserta foto lampirannya?')) return; for(const id of docIds(d)){ try{await delFile('img:'+id);}catch(x){} } delete S.doc[DK]; save(); return showTab('bukti'); }
  else return;
  save(); rDoc();
});
$('#p-doc').addEventListener('change', e=>{ const t=e.target; if(t.dataset?.da==='tog'){ S.doc[DK][t.dataset.n]=t.checked; save(); } });
$('#imgFile').addEventListener('change', async e=>{
  const fs=[...e.target.files]; if(!fs.length||IMGBLK==null) return; const d=S.doc[DK]; let bad=0;
  for(const f of fs){ try{ const url=await readImg(f); const id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); await putFile('img:'+id,url); IMG[id]=url; d.blocks[IMGBLK].imgs.push({id,label:''}); }catch(err){ bad++; } }
  if(bad) alert(bad+' foto gagal dibaca (format HEIC tidak didukung Chrome — ubah ke JPG/PNG).');
  save(); rDoc();
});

/* ---------- cetak dokumen ---------- */
function paras(s){ return String(s||'').split(/\n+/).filter(Boolean).map(x=>`<p>${esc(x).replace(PH,m=>`<mark>${m}</mark>`)}</p>`).join(''); }
function docHTML(k){
  const b=BFMAP[k], d=S.doc[k], dim=DIMS[b.d], kode=kodeOf(b), sch=S.id.sekolah;
  let bab=0,sub=0,tb=0,gb=0,lp=0; const toc=[],lt=[],lg=[]; let body='';
  const mk=s=>esc(s).replace(PH,m=>`<mark>${m}</mark>`);
  const sign=(ttl)=>`<div class="sign1"><div>${esc(S.id.kota)}, ${tglID(d.tanggal||S.id.tanggal)}<br>Kepala ${esc(sch)}<br><br><br><br><u>${esc(d.penyusun||S.id.ks)}</u></div></div>`;
  d.blocks.forEach(bl=>{
    if(bl.t==='bab'){ bab++;sub=0; toc.push('BAB '+roman(bab)+' '+bl.text); body+=`<h2 class="db">BAB ${roman(bab)}<br>${mk(bl.text)}</h2>`; }
    else if(bl.t==='sub'){ sub++; const l=bab+'.'+sub; toc.push('&nbsp;&nbsp;&nbsp;'+l+' '+esc(bl.text)); body+=`<h3>${l} ${mk(bl.text)}</h3>`; }
    else if(bl.t==='p') body+=paras(bl.text);
    else if(bl.t==='list') body+=`<ol>${String(bl.text||'').split(/\n+/).filter(Boolean).map(x=>`<li>${mk(x)}</li>`).join('')}</ol>`;
    else if(bl.t==='tbl'){ tb++; lt.push('Tabel '+tb+'. '+(bl.cap||'')); body+=`<p class="cap"><b>Tabel ${tb}.</b> ${mk(bl.cap||'')}</p><table><thead><tr>${bl.rows[0].map(c=>`<th>${mk(c)}</th>`).join('')}</tr></thead><tbody>${bl.rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
    else if(bl.t==='foto'){ gb++; const cap=bl.cap?`Gambar ${gb}. ${bl.cap}`:`Gambar ${gb}`; lg.push(cap); body+=`<div class="fgrid">${bl.imgs.map(im=>`<figure><img src="${IMG[im.id]||''}" alt=""><figcaption>${mk(im.label||'')}</figcaption></figure>`).join('')}</div><p class="cap">${mk(cap)}</p>`; }
    else if(bl.t==='ttd') body+=sign();
    else if(bl.t==='lamp'){ lp++; toc.push('Lampiran '+lp+'. '+bl.text); body+=`<h2 class="db pbk">Lampiran ${lp}. ${mk(bl.text)}</h2>`; }
  });
  const kopL=`<div class="dkop"><img src="${LOGO}" alt=""><div><b>YAYASAN PENDIDIKAN ISLAM PURNAMA CENDEKIA</b><b class="s2">SEKOLAH ISLAM TERPADU AL QOMAR MUTHMAINNAH</b><span>KB – TK – SD – SMP · ${esc(S.id.alamat)} · Telp. 021-55968344 · alqomar.sch.id</span></div></div>`;
  let h=`<div class="doc dwrap">`;
  if(d.cover) h+=`<div class="pg dcover">${kopL}<h1>SUPERVISI DAN PENILAIAN KINERJA KEPALA SEKOLAH (SPKKS)</h1><p class="c">TAHUN PELAJARAN ${esc(S.id.tahun)}</p>
    <p class="c" style="margin-top:12mm"><b>Dimensi ${dim.kode}: ${esc(dim.nama)}</b><br><b>Dokumen ${kode}</b><br>${b.ind.map(n=>`Indikator ${n}: ${esc(IND[n].t)}`).join('<br>')}</p>
    <h1 class="tt">${mk(d.title)}</h1><p class="c" style="margin-top:14mm">Disusun oleh:<br><b>${esc(d.penyusun||S.id.ks)}</b><br>Kepala ${esc(sch)}</p>
    <p class="c" style="margin-top:12mm"><b>${esc(sch.toUpperCase())}</b><br>NPSN ${esc(S.id.npsn)} · Terakreditasi ${esc(S.id.akred)}<br>${esc(S.id.alamat)}</p><p class="c"><b>${(d.tanggal||S.id.tanggal||'').slice(0,4)}</b></p></div>`;
  if(d.pengesahan) h+=`<div class="pg"><h2 class="db">LEMBAR PENGESAHAN</h2><p>Dokumen <b>${mk(d.title.charAt(0)+d.title.slice(1).toLowerCase())}</b> ${esc(sch)} telah disusun, diperiksa, dan disahkan sebagai dokumen resmi sekolah.</p>
    <div class="sign"><div>Mengetahui,<br>Pembina–Ketua Yayasan<br><br><br><br><u>${esc(S.id.pembina)}</u></div><div>${esc(S.id.kota)}, ${tglID(d.tanggal||S.id.tanggal)}<br>Kepala ${esc(sch)}<br><br><br><br><u>${esc(d.penyusun||S.id.ks)}</u></div></div></div>`;
  if(d.kp) h+=`<div class="pg"><h2 class="db">KATA PENGANTAR</h2>${paras(d.kpText)}<div class="sign1"><div>${esc(S.id.kota)}, ${tglID(d.tanggal||S.id.tanggal)}<br>Kepala ${esc(sch)}<br><br><br><br><u>${esc(d.penyusun||S.id.ks)}</u></div></div></div>`;
  if(d.toc) h+=`<div class="pg"><h2 class="db">DAFTAR ISI</h2><div class="toc">${toc.map(x=>`<div>${x}</div>`).join('')}</div>${lt.length?`<h2 class="db">DAFTAR TABEL</h2><div class="toc">${lt.map(x=>`<div>${mk(x)}</div>`).join('')}</div>`:''}${lg.length?`<h2 class="db">DAFTAR GAMBAR</h2><div class="toc">${lg.map(x=>`<div>${mk(x)}</div>`).join('')}</div>`:''}</div>`;
  return h+`<div class="dbody">${body}</div></div>`;
}
async function printDocs(keys){

  $('#print').innerHTML=keys.map(docHTML).join('');

function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\n/g,' ')+'"';
  const rows=[['No','Kode','Dimensi','Indikator','Skor','Kategori','Bukti fisik terkait','Status unggah','Nama berkas / tautan','No. SK / dokumen','Penanggung jawab','Catatan evaluator']];
  DIMS.forEach(d=>d.ind.forEach(i=>{ const ks=bfByInd[i.no]||[], st=indStatus(i.no), v=S.skor[i.no];
    rows.push([i.no,'KI-'+pad2(i.no),d.kode+'. '+d.nama,i.t,v||'',v?KAT[v]:'',ks.map(k=>DIMS[BFMAP[k].d].kode+'.'+BFMAP[k].no+' '+BFMAP[k].t).join(' | '),st.ok?'Sudah Diunggah':'Belum Diunggah',ks.map(k=>[B(k).file,B(k).link].filter(Boolean).join(' ')).filter(Boolean).join(' | '),ks.map(k=>B(k).nomor).filter(Boolean).join(' | '),ks.map(k=>B(k).pj).filter(Boolean).join(' | '),S.cat[i.no]||'']); }));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}); const u=URL.createObjectURL(blob);
  const l=document.createElement('a'); l.href=u; l.download='spkks-sd-rekap.csv'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),2000);
}
