<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard SPKKS SD — Al Qomar</title>
<style>
:root{
  --h:#1a5c38;--h2:#1e6e42;--h3:#2a8a54;--e:#c8922a;--e2:#e0a832;--ep:#fdf3e0;--kr:#faf7f2;--kr2:#f0e9d8;
  --tx:#1f2a24;--mu:#66736b;--bd:#e3dccb;--ok:#1f8a4c;--wa:#c8922a;--er:#b3392f;--wh:#fff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 "Segoe UI",Calibri,Arial,sans-serif;color:var(--tx);background:var(--kr)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;color:var(--h)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* header */
.top{background:linear-gradient(135deg,var(--h),var(--h2) 60%,var(--h3));color:#fff;padding:14px 20px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--e),var(--e2),var(--e))}
.top-in{max-width:1240px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{flex:1 1 280px;min-width:0}
.brand h1{color:#fff;font-size:19px;line-height:1.2}
.brand small{opacity:.85;display:block;margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.st{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:6px 12px;min-width:92px}
.st b{display:block;font-size:18px;line-height:1.1}
.st span{font-size:11px;opacity:.85}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:#fff;color:var(--h);border-radius:8px;padding:7px 13px;font-weight:600}
.btn:hover{background:var(--ep)}
.btn.gold{background:var(--e);border-color:var(--e);color:#fff}
.btn.gold:hover{background:var(--e2)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:600}
.btn.dg{color:var(--er)}
.top .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.25)}
.top .btn.gold{background:var(--e);border-color:var(--e)}
.tabs{max-width:1240px;margin:0 auto;display:flex;gap:4px;padding:14px 20px 0;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:10px 10px 0 0;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{background:rgba(255,255,255,.15)}
.tab.on{color:var(--h);background:#fff;border-bottom-color:var(--e)}
main{max-width:1240px;margin:0 auto;padding:0 20px 60px}
.pane{display:none;background:#fff;border:1px solid var(--bd);border-radius:0 12px 12px 12px;padding:20px;box-shadow:0 2px 10px rgba(26,92,56,.06)}
.pane.on{display:block}
.save{font-size:11px;opacity:.85;align-self:center}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{border:1px solid var(--bd);border-left:5px solid var(--e);border-radius:10px;padding:12px 14px;background:var(--kr)}
.card small{color:var(--mu);display:block}
.card b{font-size:26px;font-family:Georgia,serif;color:var(--h);line-height:1.15}
.card em{font-style:normal;font-size:12px;color:var(--mu)}
.pred{font-size:44px!important}
h2{font-size:18px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--kr2);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;background:var(--e);transform:rotate(45deg);flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 16px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mu)}
label.f input,label.f textarea{display:block;width:100%;margin-top:3px;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:#fff;color:var(--tx);font-weight:400;font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--e2);outline-offset:0}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bd);padding:7px 9px;vertical-align:top;text-align:left}
th{background:var(--h);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
tbody tr:nth-child(even) td{background:#fcfaf5}
.num{text-align:center;white-space:nowrap}
.bar{height:8px;background:var(--kr2);border-radius:5px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--h3),var(--e))}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--kr2);color:var(--mu);white-space:nowrap}
.b4{background:#d6efdf;color:#0f6a37}.b3{background:#e3f1d3;color:#3d6e12}.b2{background:#fbeccb;color:#8a5a00}.b1{background:#f8d9d5;color:#a02a20}
.bok{background:#d6efdf;color:#0f6a37}.bno{background:#f3e7e5;color:#a02a20}.bpa{background:#fbeccb;color:#8a5a00}
.chip{display:inline-block;margin:1px 2px 1px 0;padding:1px 8px;border:1px solid var(--h3);border-radius:99px;color:var(--h);background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.chip:hover{background:var(--h);color:#fff}
.chip.bf{border-color:var(--e);color:#8a5a00}
.chip.bf:hover{background:var(--e);color:#fff}
.ki{font-size:10px;color:var(--e);font-weight:700;letter-spacing:.4px}
.doc{margin-top:4px;font-size:12px;color:var(--mu)}
.doc b{color:var(--h)}
/* toolbar */
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool input[type=search],.tool select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--h);color:#fff}
.dhead td{background:var(--h2)!important;color:#fff;font-weight:700;font-family:Georgia,serif;font-size:14px}
.dhead small{font-weight:400;opacity:.9;font-family:"Segoe UI",sans-serif;margin-left:8px}
/* skor */
.sk{display:inline-flex;gap:4px}
.sk button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;font-weight:700;color:var(--mu)}
.sk button:hover{border-color:var(--h3)}
.sk button.on{color:#fff;border-color:transparent}
.sk button.on[data-v="4"]{background:#1f8a4c}.sk button.on[data-v="3"]{background:#6aa52b}.sk button.on[data-v="2"]{background:#d99a14}.sk button.on[data-v="1"]{background:#c0463b}
td textarea,td input[type=text],td input[type=url]{width:100%;padding:5px 7px;border:1px solid var(--bd);border-radius:6px;background:#fff;resize:vertical}
td textarea{min-height:44px}
tr.flash td{animation:fl 1.8s}
@keyframes fl{0%,40%{background:#fff0bd}100%{background:inherit}}
.sw{position:relative;display:inline-block;width:42px;height:24px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cfc8b6;border-radius:24px;transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::before{transform:translateX(18px)}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.hint{color:var(--mu);font-size:12px}
.warn{background:var(--ep);border:1px solid #ecd9a8;border-radius:10px;padding:12px 16px}
.warn ul{margin:6px 0 0;padding-left:20px}
.warn li{margin:2px 0}
.warn a{color:var(--h);font-weight:700;cursor:pointer;text-decoration:underline}
.ok{color:var(--ok);font-weight:700}
.todo{background:#fff5d6;border-left:3px solid var(--e);padding:3px 8px;border-radius:4px;font-size:12px;margin-top:4px}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pp .card{border-left-width:5px}
.pp p{margin:6px 0 10px;color:var(--mu)}
/* print area */
#print{display:none}
@media (max-width:820px){
  .top-in{gap:10px}.brand h1{font-size:16px}.pane{padding:12px;border-radius:0 0 12px 12px}main,.tabs{padding-left:10px;padding-right:10px}
  table.rs,table.rs tbody,table.rs tr,table.rs td{display:block;width:100%}
  table.rs thead{display:none}
  table.rs tr{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:6px;background:#fff}
  table.rs td{border:0;padding:4px 6px}
  table.rs tr.dhead{background:var(--h2);border-radius:8px}
  table.rs tr:nth-child(even) td{background:transparent}
}
@page{size:A4;margin:14mm 14mm 16mm}
@page land{size:A4 landscape;margin:12mm}
@media print{
  html,body{background:#fff!important}
  .top,.tabs,main{display:none!important}
  #print{display:block!important;font:11pt/1.45 "Times New Roman",Georgia,serif;color:#000}
  #print h1,#print h2,#print h3{color:#000;font-family:"Times New Roman",serif;border:0}
  #print h2::before{display:none}
  #print table{font-size:9.5pt}
  #print th{background:#1a5c38!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:8.5pt}
  #print td,#print th{border:1px solid #777;padding:3px 5px}
  #print tbody tr:nth-child(even) td{background:#fff}
  #print tr{break-inside:avoid}
  #print .pg{break-after:page}
  #print .land{page:land}
  #print .dhead td{background:#d9e8de!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .kop{text-align:center;border-bottom:3px double #1a5c38;padding-bottom:8px;margin-bottom:14px}
  .kop b{display:block;font-size:13pt;color:#1a5c38}
  .kop span{font-size:9pt}
  .cover{text-align:center;padding-top:50mm}
  .cover h1{font-size:20pt;margin:14mm 0 4mm}
  .cover p{margin:3px 0}
  .sign{display:flex;justify-content:space-around;margin-top:18mm;text-align:center;break-inside:avoid}
  .sign div{min-width:60mm}
  .sign u{font-weight:bold}
  .pb{border:1px solid #000;padding:2px 8px}
}
@media screen{
  .kop,.cover,.sign{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Dashboard SPKKS — Jenjang SD</h1>
      <small>Supervisi &amp; Penilaian Kinerja Kepala Sekolah · <span id="hd-sch"></span></small>
    </div>
    <div class="stats">
      <div class="st"><b id="hs-nilai">0/99</b><span>Indikator dinilai</span></div>
      <div class="st"><b id="hs-bf">0/87</b><span>Bukti fisik siap</span></div>
      <div class="st"><b id="hs-pct">–</b><span>Skor total</span></div>
    </div>
    <div class="acts">
      <button class="btn gold" data-act="print" data-m="full">Cetak / Simpan PDF</button>
    </div>
    <div class="save" id="saveMsg"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="ringkasan">Ringkasan</button>
    <button class="tab" data-tab="instrumen">Instrumen (99)</button>
    <button class="tab" data-tab="bukti">Bukti Fisik (87)</button>
    <button class="tab" data-tab="cetak">Cetak &amp; Cadangan</button>
  </nav>
</header>

<main id="app">
  <section class="pane on" id="p-ringkasan"></section>
  <section class="pane" id="p-instrumen"></section>
  <section class="pane" id="p-bukti"></section>
  <section class="pane" id="p-cetak"></section>
</main>

<div id="print"></div>
<input type="file" id="impFile" accept="application/json" hidden>
<input type="file" id="attFile" hidden>

<script>
const DATA = {"dims": [{"kode": "I", "nama": "Kedisiplinan & Integritas", "ind": [{"no": 1, "t": "Hadir di sekolah tepat waktu sesuai ketentuan jam kerja. Tetap berada di sekolah hingga jam kerja berakhir, kecuali ada tugas dinas luar.", "doc": "Daftar Hadir Fingerprint, Buku Piket"}, {"no": 2, "t": "Menunjukkan konsistensi dalam mengikuti agenda sekolah (rapat, upacara, dll).", "doc": "Notulensi, Daftar Hadir, Dokumentasi"}, {"no": 3, "t": "Transparan dalam pengelolaan keuangan dan sumber daya sekolah.", "doc": "Papan pengumuman pengelolaan dana"}, {"no": 4, "t": "Menjaga kerahasiaan data atau dokumen negara yang bersifat sensitif.", "doc": "Keamanan dokumen (SPJ, Tanda Terima Ijazah)"}, {"no": 5, "t": "Berani mengakui kesalahan dan bertanggung jawab atas kebijakan yang dibuat.", "doc": "Lembar hasil observasi + foto dokumentasi"}, {"no": 6, "t": "Kehadiran Kegiatan Sekolah: Menghadiri upacara bendera, rapat guru, dan acara resmi sekolah lainnya.", "doc": "Notulen / Daftar Hadir Rapat"}, {"no": 7, "t": "Efektivitas Waktu: Memanfaatkan waktu kerja untuk supervisi, manajerial, dan pengembangan sekolah.", "doc": "Jurnal Harian Kepala Sekolah"}, {"no": 8, "t": "Pakaian dan Penampilan: Berpakaian rapi, bersih, dan sesuai dengan regulasi seragam yang berlaku.", "doc": "Lembar hasil observasi Langsung + foto dokumentasi"}, {"no": 9, "t": "Etika Komunikasi: Bertutur kata sopan, objektif, dan mampu berkomunikasi dengan baik kepada seluruh warga sekolah.", "doc": "Rekap hasil wawancara Guru/Staf + foto dokumentasi"}, {"no": 10, "t": "Integritas dan Kejujuran: Menunjukkan kesesuaian antara perkataan dan perbuatan dalam mengambil keputusan.", "doc": "Rekap hasil wawancara Guru/Staf + foto dokumentasi"}, {"no": 11, "t": "Pengendalian Diri: Mampu mengelola emosi dalam menghadapi konflik atau tekanan pekerjaan.", "doc": "Rekap hasil wawancara Guru/Staf + foto dokumentasi"}, {"no": 12, "t": "Adanya papan informasi realisasi anggaran (BOS/Komite) yang dipasang di area publik sekolah.", "doc": "Dokumentasi papan informasi"}, {"no": 13, "t": "Kemudahan akses bagi warga sekolah untuk menanyakan detail penggunaan anggaran.", "doc": "Prosedur akses"}, {"no": 14, "t": "Keterbukaan informasi mengenai pembagian tugas mengajar dan tugas tambahan guru.", "doc": "SK Pembagian Tugas terpublikasi"}, {"no": 15, "t": "Kejelasan kriteria pemberian reward, hukuman, atau rekomendasi kenaikan pangkat bagi staf.", "doc": "Dokumen kriteria tertulis"}, {"no": 16, "t": "Publikasi kriteria KKTP dan sistem penilaian kepada murid/orang tua.", "doc": "Dokumen sosialisasi (Undangan, Daftar Hadir, Notulen, Foto)"}, {"no": 17, "t": "Transparansi dalam proses SPMB/PPDB sesuai jalur yang ditetapkan.", "doc": "Laporan SPMB/PPDB & pengumuman"}, {"no": 18, "t": "Pengelolaan buku inventaris barang yang dapat diperiksa sewaktu-waktu.", "doc": "Buku Inventaris"}, {"no": 19, "t": "Keterbukaan informasi mengenai bantuan sosial (KIP/PIP) agar tepat sasaran.", "doc": "Daftar penerima bantuan"}, {"no": 20, "t": "Sosialisasi bantuan dari pihak ketiga atau hibah secara tertulis kepada warga sekolah.", "doc": "Dokumen sosialisasi (Undangan, Daftar Hadir, Notulen, Foto)"}, {"no": 21, "t": "Ketersediaan kotak saran, nomor pengaduan, atau kanal digital (website/sosmed) untuk kritik dan masukan.", "doc": "Dokumentasi kanal pengaduan"}]}, {"kode": "II", "nama": "Kepemimpinan & Managerial", "ind": [{"no": 22, "t": "Visi & Misi: Mengkomunikasikan visi-misi secara jelas dan menjadikannya dasar pengambilan keputusan.", "doc": "Dokumen Sosialisasi & Implementasi Visi"}, {"no": 23, "t": "Keteladanan: Menunjukkan integritas, kedisiplinan, dan etika kerja yang tinggi (menjadi role model).", "doc": "Absensi, observasi perilaku, testimoni guru"}, {"no": 24, "t": "Pemberdayaan Guru: Memotivasi dan memberi kesempatan guru untuk pengembangan diri (pelatihan/workshop).", "doc": "Surat tugas pelatihan, sertifikat guru, laporan Penggunaan Ruang GTK"}, {"no": 25, "t": "Iklim Sekolah: Menciptakan lingkungan se /* ---------- IndexedDB (berkas lampiran) ---------- */
let dbp;
function db(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    try{
      const r = indexedDB.open('spkks-files',1);
      r.onupgradeneeded = ()=>r.result.createObjectStore('f');
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbp;
}
async function idb(mode, fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction('f',mode); const r = fn(t.objectStore('f'));
    t.oncomplete = ()=>res(r&&r.result); t.onerror = ()=>rej(t.error);
  });
}
const putFile = (k,file)=>idb('readwrite',s=>s.put(file,k));
const getFile = k=>idb('readonly',s=>s.get(k));
const delFile = k=>idb('readwrite',s=>s.delete(k));

/* ---------- perhitungan ---------- */
function indStatus(n){
  const keys = bfByInd[n]||[]; const done = keys.filter(k=>B(k).st==='sudah').length;
  return {done,total:keys.length,ok:keys.length>0&&done===keys.length};
}
function dimStats(k){
  const d = DIMS[k]; let n=0,sum=0,up=0;
  d.ind.forEach(i=>{ const v=S.skor[i.no]; if(v){n++;sum+=v;} if(indStatus(i.no).ok) up++; });
  const avg = n?sum/n:0;
  return {n,sum,avg,pct:n?sum/(4*n):0,up,tot:d.ind.length,kat:n?katAvg(avg):'–'};
}
function totals(){
  let n=0,sum=0,up=0;
  DIMS.forEach((d,k)=>{const s=dimStats(k); n+=s.n; sum+=s.sum; up+=s.up;});
  const p = n?sum/(4*n):0;
  const bfDone = BF.filter(b=>B(bfKey(b)).st==='sudah').length;
  return {n,sum,up,pct:p,avg:n?sum/n:0,bfDone,final:n===TOTAL_IND,pred:n?predikat(p):['–','Belum dinilai']};
}
function stats(){
  const t = totals();
  $('#hs-nilai').textContent = t.n+'/'+TOTAL_IND;
  $('#hs-bf').textContent = t.bfDone+'/'+BF.length;
  $('#hs-pct').textContent = t.n?pct(t.pct)+' ('+t.pred[0]+')':'–';
  $('#hd-sch').textContent = S.id.sekolah;
}

function indMatch(i){

  if(FI.m==='nilai' && v) return false;
  if(FI.m==='bukti' && indStatus(i.no).ok) return false;
  if(FI.q){ const q=FI.q.toLowerCase(); if(!(String(i.no)===q||(i.t+' '+i.doc).toLowerCase().includes(q)||('ki-'+pad2(i.no))===q)) return false; }

}

/* ---------- Cetak ---------- */
function kop(){ return `<div class="kop"><b>YAYASAN PENDIDIKAN ISLAM PURNAMA CENDEKIA</b><b>${esc(S.id.sekolah.toUpperCase())} MUTHMAINNAH</b><span>${esc(S.id.alamat)} · Telp. 021-55968344 · alqomar.sch.id</span></div>`; }
function signBlock(){ return `<div class="sign"><div>Mengetahui,<br>Pembina–Ketua Yayasan<br><br><br><br><u>${esc(S.id.pembina)}</u></div><div>${esc(S.id.kota)}, ${tglID(S.id.tanggal)}<br>Kepala ${esc(S.id.sekolah)}<br><br><br><br><u>${esc(S.id.ks)}</u></div><div>Penilai,<br>${esc(S.id.jabPenilai||'')}<br><br><br><br><u>${esc(S.id.penilai||'……………………………')}</u></div></div>`; }
function ringTbl(){
  const t = totals();
  return `<table><thead><tr><th>Dimensi</th><th>Indikator</th><th>Terisi</th><th>Total skor</th><th>Rata-rata</th><th>%</th><th>Kategori</th><th>Bukti lengkap</th></tr></thead><tbody>${DIMS.map((d,k)=>{const s=dimStats(k);return `<tr><td>${d.kode}. ${esc(d.nama)}</td><td class="num">${s.tot}</td><td class="num">${s.n}</td><td class="num">${s.sum}</td><td class="num">${s.n?dec(s.avg):'–'}</td><td class="num">${s.n?pct(s.pct):'–'}</td><td>${s.kat}</td><td class="num">${s.up}/${s.tot}</td></tr>`}).join('')}<tr><td><b>TOTAL</b></td><td class="num"><b>${TOTAL_IND}</b></td><td class="num"><b>${t.n}</b></td><td class="num"><b>${t.sum}</b></td><td class="num"><b>${t.n?dec(t.avg):'–'}</b></td><td class="num"><b>${t.n?pct(t.pct):'–'}</b></td><td><b>${t.n?katAvg(t.avg):'–'}</b></td><td class="num"><b>${t.up}/${TOTAL_IND}</b></td></tr></tbody></table>`;
}
function ringPage(){
  const t=totals();
  return `<div class="pg">${kop()}<h2 style="text-align:center">RINGKASAN HASIL SPKKS — JENJANG SD</h2>
  <table style="margin-bottom:10px"><tbody>
   <tr><td style="width:32%">Nama sekolah</td><td>${esc(S.id.sekolah)} (NPSN ${esc(S.id.npsn)}, Akreditasi ${esc(S.id.akred)})</td></tr>
   <tr><td>Kepala Sekolah</td><td>${esc(S.id.ks)}</td></tr><tr><td>Penilai</td><td>${esc(S.id.penilai||'……………………………')} ${esc(S.id.jabPenilai||'')}</td></tr>
   <tr><td>Tahun pelajaran</td><td>${esc(S.id.tahun)}</td></tr></tbody></table>
  ${ringTbl()}
  <p style="margin-top:10px"><b>Persentase total:</b> ${t.n?pct(t.pct):'–'} &nbsp; <b>Predikat:</b> <span class="pb">${t.pred[0]}</span> ${t.pred[1]} &nbsp; <b>Status:</b> ${t.final?'FINAL':'DRAFT ('+t.n+' dari '+TOTAL_IND+' indikator terisi)'}</p>
  <p style="font-size:9pt">Rumus: persentase = total skor ÷ (4 × jumlah indikator terisi). Predikat A ≥ 91%, B ≥ 81%, C ≥ 71%, D di bawah 71%.</p>
  <h3>Catatan perbaikan per dimensi</h3>
  <table><tbody>${DIMS.map((d,k)=>`<tr><td style="width:30%">${d.kode}. ${esc(d.nama)}</td><td>${esc(S.dimNote[k]||'—').replace(/\n/g,'<br>')}</td></tr>`).join('')}</tbody></table>
  ${signBlock()}</div>`;
}
function instPage(){
  let h=`<div class="land pg"><h2 style="text-align:center">INSTRUMEN SUPERVISI DAN PENILAIAN KINERJA KEPALA SEKOLAH (SPKKS) — SD — TAHUN ${esc(S.id.tahun)}</h2>
  <table><thead><tr><th style="width:4%">No</th><th style="width:33%">Indikator kinerja</th><th style="width:20%">Dokumen / bukti fisik</th><th style="width:5%">Skor</th><th style="width:9%">Kategori</th><th style="width:9%">Status unggah</th><th style="width:20%">Nama file / tautan · catatan</th></tr></thead><tbody>`;
  DIMS.forEach((d,k)=>{
    h+=`<tr class="dhead"><td colspan="7"><b>${d.kode}. ${esc(d.nama.toUpperCase())}</b> — ${dimLine(k)}</td></tr>`;
    d.ind.forEach(i=>{
      const v=S.skor[i.no], st=indStatus(i.no);
      const fl=(bfByInd[i.no]||[]).map(k=>{const x=B(k);return [x.file,x.link].filter(Boolean).join(' · ');}).filter(Boolean);
      h+=`<tr><td class="num">${i.no}</td><td>${esc(i.t)}</td><td>${esc(i.doc)}</td><td class="num"><b>${v||''}</b></td><td>${v?KAT[v]:''}</td><td>${st.ok?'Sudah Diunggah':'Belum Diunggah'}</td><td>${fl.map(esc).join('<br>')}${S.cat[i.no]?'<br><i>'+esc(S.cat[i.no])+'</i>':''}</td></tr>`;
    });
  });
  return h+'</tbody></table></div>';
}
function bfPage(){
  let h=`<div class="pg">${kop()}<h2 style="text-align:center">KESIMPULAN BUKTI FISIK PER KOMPONEN</h2><p style="text-align:center;margin-top:0">Instrumen SPKKS Jenjang SD · Tahun ${esc(S.id.tahun)}</p>
  <table><thead><tr><th style="width:8%">No</th><th>Bukti fisik / dokumen</th><th style="width:16%">No. indikator terkait</th><th style="width:12%">Status</th><th style="width:26%">Nama file / tautan</th></tr></thead><tbody>`;
  DIMS.forEach((d,k)=>{
    h+=`<tr class="dhead"><td colspan="5"><b>${d.kode}. ${esc(d.nama.toUpperCase())}</b> (Indikator ${d.ind[0].no}–${d.ind[d.ind.length-1].no})</td></tr>`;
    BF.filter(b=>b.d===k).forEach(b=>{const x=B(bfKey(b));h+=`<tr><td class="num">${b.no}</td><td>${esc(b.t)}</td><td class="num">${b.ind.join(', ')}</td><td>${x.st==='sudah'?'☑ Siap':'☐ Belum'}</td><td>${esc([x.file,x.link].filter(Boolean).join(' · '))}</td></tr>`});
  });
  return h+'</tbody></table></div>';
}
function coverPage(){
  const t=totals();
  return `<div class="pg"><div class="cover">${kop()}
  <h1>SUPERVISI DAN PENILAIAN KINERJA<br>KEPALA SEKOLAH (SPKKS)</h1><p><b>JENJANG SEKOLAH DASAR (SD)</b></p><p>Tahun Pelajaran ${esc(S.id.tahun)}</p>
  <p style="margin-top:14mm">Disusun oleh:</p><p><b>${esc(S.id.ks)}</b></p><p>Kepala ${esc(S.id.sekolah)}</p>
  <p style="margin-top:14mm"><b>${esc(S.id.sekolah.toUpperCase())}</b></p><p>NPSN ${esc(S.id.npsn)} · Terakreditasi ${esc(S.id.akred)}</p><p>${esc(S.id.alamat)}</p>
  <p style="margin-top:10mm">Hasil: <b>${t.n?pct(t.pct)+' — Predikat '+t.pred[0]+' ('+t.pred[1]+')':'belum dinilai'}</b></p></div></div>`;
}
function doPrint(m){
  const el=$('#print'); let h='';
  if(m==='full') h = coverPage()+ringPage()+instPage()+bfPage();
  else if(m==='ring') h = ringPage();
  else h = bfPage();
  el.innerHTML = h;
  setTimeout(()=>window.print(),80);
}

/* ---------- event ---------- */
function flash(sel){ const el=$(sel); if(!el) return; el.scrollIntoView({block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function goInd(n){
  FI.dim='all';FI.q='';FI.m='all';
  const p=$('#p-instrumen'); if(p.dataset.init){$('#fq').value='';$('#fd').value='all';$$('#fm button').forEach(x=>x.classList.toggle('on',x.dataset.m==='all'));}
  showTab('instrumen'); flash('#ind-'+n);
}
function goBf(k){
  FB.dim='all';FB.q='';FB.m='all';
  const p=$('#p-bukti'); if(p.dataset.init){$('#bq').value='';$('#bd').value='all';$$('#bm button').forEach(x=>x.classList.toggle('on',x.dataset.m==='all'));}
  showTab('bukti'); flash('#bf-'+k);
}
let attachKey=null;
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.tab){ showTab(t.dataset.tab); return; }
  const a=t.dataset.act, k=t.dataset.k, n=t.dataset.n&&+t.dataset.n;
  if(a==='skor'){
    const v=+t.dataset.v; if(S.skor[n]===v) delete S.skor[n]; else S.skor[n]=v; save();
    const row=$('#ind-'+n), cur=S.skor[n];
    $$('.sk button',row).forEach(b=>b.classList.toggle('on',+b.dataset.v===cur));
    $('[data-c=kat]',row).innerHTML = cur?`<span class="badge b${cur}">${KAT[cur]}</span>`:'<span class="badge">–</span>';
    const dh=$('#dh-'+dimOf[n]); if(dh) dh.textContent=dimLine(dimOf[n]);
    stats();
    if(FI.m==='nilai'&&cur){ setTimeout(()=>{ if(!indMatch(IND[n])){ row.remove(); } },350); }
  }
  else if(a==='goInd') goInd(n);
  else if(a==='goBf') goBf(k);
  else if(a==='print') doPrint(t.dataset.m);
  else if(a==='attach'){ attachKey=k; const f=$('#attFile'); f.value=''; f.click(); }
  else if(a==='openF'){ try{ const f=await getFile(k); if(f){ const u=URL.createObjectURL(f); window.open(u,'_blank'); setTimeout(()=>URL.revokeObjectURL(u),60000);} else alert('Berkas tidak ditemukan di peramban ini.'); }catch(err){ alert('Gagal membuka berkas.'); } }
  else if(a==='delF'){ if(!confirm('Hapus berkas lampiran ini dari peramban? (nama berkas tetap tersimpan)')) return; try{await delFile(k);}catch(err){} B(k).blob=false; save(); drawBf(); stats(); }
  else if(a==='export'){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob);
    const l=document.createElement('a'); l.href=u; l.download='spkks-sd-'+S.id.tahun.replace('/','-')+'-cadangan.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),2000);
  }
  else if(a==='import') $('#impFile').click();
  else if(a==='reset'){
    if(!confirm('Kosongkan SEMUA skor, catatan, dan status bukti fisik? Tindakan ini tidak dapat dibatalkan.')) return;
    const keepId=S.id; S=DEF(); S.id=keepId; S.bf={}; save(); $('#p-instrumen').dataset.init=''; $('#p-bukti').dataset.init=''; showTab('ringkasan');
  }
});
document.addEventListener('input', e=>{
  const f=e.target.dataset?.f; if(!f) return;
  const v = e.target.value;
  if(f.startsWith('cat.') && !v) delete S.cat[f.slice(4)]; else setPath(f, v);
  save();
  if(f==='id.sekolah') stats();
});
document.addEventListener('change', e=>{
  const t=e.target, a=t.dataset?.act, k=t.dataset?.k;
  if(a==='bfTog'){
    B(k).st = t.checked?'sudah':'belum'; save();
    const row=$('#bf-'+k); $('[data-c=lab]',row).textContent=t.checked?'Sudah':'Belum'; stats();
  }
  else if(a==='bfTodo'){ B(k).todo=t.checked; save(); }
  else if(t.dataset?.bf){
    const x=B(t.dataset.bf);
    if((x.file||x.link) && x.st!=='sudah'){ x.st='sudah'; save(); const row=$('#bf-'+t.dataset.bf); $('[data-act=bfTog]',row).checked=true; $('[data-c=lab]',row).textContent='Sudah'; stats(); }
    if(t.type==='url'){ drawBfRowTools(t.dataset.bf); }
  }
});
function drawBfRowTools(k){ const row=$('#bf-'+k); if(!row) return; const pos=row.querySelector('.fl'); const x=B(k);
  pos.innerHTML = `<button class="btn sm" data-act="attach" data-k="${k}">Lampirkan berkas</button>${x.blob?`<button class="btn sm" data-act="openF" data-k="${k}">Buka</button><button class="btn sm dg" data-act="delF" data-k="${k}">Hapus berkas</button>`:''}${x.link?`<a class="btn sm" href="${esc(x.link)}" target="_blank" rel="noopener">Buka tautan</a>`:''}`; }
$('#attFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f||!attachKey) return;
  const k=attachKey;
  try{ await putFile(k,f); const x=B(k); x.blob=true; if(!x.file) x.file=f.name; x.st='sudah'; save(); drawBf(); stats(); }
  catch(err){ alert('Peramban menolak menyimpan berkas (mode privat / kuota penuh). Isi nama berkas atau tautan saja.'); }
});
$('#impFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{
    const o=JSON.parse(r.result); if(!o.skor||!o.bf||!o.id) throw 0;
    if(!confirm('Impor akan MENIMPA data saat ini. Lanjutkan?')) return;
    S={id:{...DEF().id,...o.id},skor:o.skor,cat:o.cat||{},dimNote:o.dimNote||{},bf:o.bf};
    $$('.pane').forEach(p=>p.dataset.init=''); save(); showTab('ringkasan');
  }catch(err){ alert('Berkas cadangan tidak valid.'); } }; r.readAsText(f);
});
window.addEventListener('beforeprint',()=>{ if(!$('#print').innerHTML) $('#print').innerHTML=coverPage()+ringPage()+instPage()+bfPage(); });
window.addEventListener('afterprint',()=>{ $('#print').innerHTML=''; });

load(); showTab('ringkasan');
</script>
</body>
</html>
